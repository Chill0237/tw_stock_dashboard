name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:          # 可以在 Actions 頁面手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # 一天 3–5 次 push，避免兩次部署同時跑
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    needs: build              # 等上傳的 job 完全結束才部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
